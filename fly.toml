app = 'quarkus-quinoa-damp-glade-4179'
primary_region = 'cdg'

[build]
	[http_service]
		internal_port = 8080
		force_https = true
		auto_stop_machines = "off"
		auto_start_machines = false
		min_machines_running = 1
		processes = ['app']

	[[vm]]
		memory = '512mb'
		cpu_kind = 'shared'
		cpus = 1
